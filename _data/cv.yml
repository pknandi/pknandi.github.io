    Experience:
      - company: Center for Computational & Data Sciences (CCDS)
        position: Research Collaborator
        location: Dhaka, Bangladesh
        url: https://ccds.ai/
        start_date: 2025-07
        summary: "Advisors: Dr. A K M Mahbubur Rahman, Dr. Md Mofijul Islam"
        highlights:
          - Collaborating on test-time adaptation in VLMs and PyTutor, an LLM-based pedagogical tool for learning Python.
          - Contributed to BaFCo, a document-understanding benchmark for complex Bangla form comprehension, published at ECCV 2026.
          - Developing streaming speech-driven 3D motion generation models (since April 2026), investigating causal multimodal learning and knowledge distillation for low-latency, speech-aligned motion synthesis.

      - company: Therap (BD) Ltd.
        position: Machine Learning Engineer II
        location: Dhaka, Bangladesh
        url: https://therapbd.com/
        start_date: 2024-10
        highlights:
          - Developed an LLM-powered retrieval-augmented generation (RAG) support chatbot from user guides and support chat data; built automated data scraping and processing pipelines, improved answer quality through retrieval enhancements and prompt engineering, and developed benchmark datasets and automated evaluation pipelines.
          - Built a spectrogram-based audio classification model for detecting sounds in care facilities, using real-world audio collected with Raspberry Pi 5 and mini microphones; refined preprocessing to reduce false positives.
          - Implemented real-time speech-to-text with OpenAI Whisper for live audio streams on Raspberry Pi; tuned preprocessing to reduce latency and transcription errors.

      - company: Therap (BD) Ltd.
        position: Machine Learning Engineer
        location: Dhaka, Bangladesh
        url: https://therapbd.com/
        start_date: 2022-10
        end_date: 2024-09
        highlights:
          - Designed and built a computer vision system that monitors patient activity remotely while preserving privacy.
          - Researched video-understanding and vision–language models and wrote recommendations to guide model selection.
          - Devised algorithms that aggregate and statistically analyze model outputs into real-time, high-level activity data.
          - Contributed to a video redaction pipeline using person detection, instance segmentation, and multi-object tracking.
          - Co-inventor on a granted U.S. patent for non-invasive monitoring of identifiable information in medical facilities.

      - company: Therap (BD) Ltd.
        position: Associate Machine Learning Engineer
        location: Dhaka, Bangladesh
        url: https://therapbd.com/
        start_date: 2021-09
        end_date: 2022-09
        highlights:
          - Researched and tested ML models and datasets for activity recognition, pose estimation, segmentation, and face recognition in medical care.
          - Researched ways to enhance NVIDIA Jetson devices and DeepStream SDK capabilities.

      - company: Green Networking Research Group (GNR), University of Dhaka
        position: Undergraduate Research Assistant
        location: Dhaka, Bangladesh
        start_date: 2020-01
        end_date: 2021-06
        summary: "Supervisor: Prof. Md. Abdur Razzaque, Professor & Chairman, Department of CSE, University of Dhaka"
        highlights:
          - Researched game theory, deep learning, optimization, and meta-heuristic methods for task offloading and resource allocation in cloud computing, with a focus on IoT applications.
          - Developed a novel algorithm using Social Cognitive Optimization, a meta-heuristic approach, to determine optimal task offloading policies for energy-harvesting IoT devices.
          - Gained in-depth knowledge of research methodology and practical experience conducting studies and writing scholarly papers.

