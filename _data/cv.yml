    Projects:
      - name: Streaming Speech-Driven 3D Motion Generation
        start_date: 2026-04
        highlights:
          - Developing a causal multimodal generative model for continuous 3D co-speech motion synthesis from streaming audio, without future audio context.
          - Investigating knowledge distillation and inference strategies to improve motion realism and speech alignment under streaming constraints.
          - Designing latency audits and evaluation protocols to assess audio look-ahead, temporal alignment, and motion continuity in online generation.

      - name: Task Offloading Policy in Mobile Edge Cloud — task offloading optimization for energy-harvesting IoT devices
        date: 2021
        highlights:
          - Designed and implemented a system and algorithm that optimize computation offloading decisions from IoT devices to the edge cloud, improving user utility and system efficiency.

      - name: Dishari — AI-enabled pathfinder robot pair
        date: 2019
        highlights:
          - A ground robot and a drone that navigate using computer vision written in Python.

      - name: Autonomous Traffic Monitoring and Congestion Control
        date: 2018
        highlights:
          - IoT-based traffic management using edge computing and fuzzy neural networks for real-time monitoring, noise mapping, and optimal route generation.

      - name: Sumobot — sensor-based sumo robot
        date: 2018
        highlights:
          - Built an Arduino-based sumo robot, integrating sensor feedback and motor control for navigation and pushing opponents out of the ring.

      - name: Decoded — jigsaw puzzle game
        date: 2017
        highlights:
          - Single-player jigsaw puzzle game in C++ using the Borland Graphics Interface (BGI).

